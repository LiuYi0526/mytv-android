name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Build and run unit tests
        run: bash ./gradlew :core:data:testDebugUnitTest :tv:testOriginalDebugUnitTest :tv:assembleOriginalDebug --no-daemon --max-workers=2 --stacktrace
      - name: Check native alignment
        run: python3 scripts/check_native_alignment.py tv/build/outputs/apk/original/debug/*.apk
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: test-reports
          path: |
            core/data/build/reports/tests/
            tv/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
