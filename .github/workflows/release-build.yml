name: Build signed release APKs

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: python
        run: |
          import base64, os
          from pathlib import Path
          data = os.environ.get('KEYSTORE_BASE64', '')
          if not data:
              raise SystemExit('Configure the KEYSTORE_BASE64 repository secret first')
          path = Path(os.environ['RUNNER_TEMP']) / 'liuguang-tv-release.jks'
          path.write_bytes(base64.b64decode(data, validate=True))
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf8') as env_file:
              env_file.write('KEYSTORE=' + str(path) + '\n')
      - name: Build signed release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          required = ['KEYSTORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD']
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing repository secrets: ' + ', '.join(missing))
          PY
          bash ./gradlew :tv:assembleOriginalRelease -PsplitApks=true --no-daemon --max-workers=2 --stacktrace '-Dorg.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8' -Pkotlin.compiler.execution.strategy=in-process
      - name: Verify and collect release files
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/release/prepare_release.py --build-tools "$ANDROID_HOME/build-tools/36.0.0" --repository "$RELEASE_REPOSITORY"
      - name: Save signed release files
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: liuguang-tv-release
          path: |
            dist/*.apk
            dist/*.json
            dist/SHA256SUMS.txt
            dist/RELEASE_NOTES.md
            dist/LICENSE
            dist/THIRD_PARTY.md
          if-no-files-found: error
          retention-days: 30
      - name: Save R8 mapping
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: liuguang-tv-debug-symbols
          path: dist/debug-symbols/
          if-no-files-found: error
          retention-days: 90
      - name: Remove temporary signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/liuguang-tv-release.jks"
